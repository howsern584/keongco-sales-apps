{% extends "base.html" %}
{% set show_nav = false %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh]">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">

    <!-- Logo / app name -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-light mb-3">
        <svg class="w-8 h-8 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-brand" data-i18n="app_name">Keongco Sales</h1>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/app/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="login_username">Username</label>
        <input name="username" type="text" autocomplete="username" required
               class="w-full border border-gray-300 rounded-lg px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand"
               data-i18n="login_username" placeholder="Username"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="login_password">Password</label>
        <input name="password" type="password" autocomplete="current-password" required
               class="w-full border border-gray-300 rounded-lg px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand"
               data-i18n="login_password" placeholder="Password"/>
      </div>
      <button type="submit"
              class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-lg text-base transition">
        <span data-i18n="login_btn">Sign In</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
